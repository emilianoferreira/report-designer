    .label-text, .label-price {

      white-space: normal;
      word-break: break-word;
    }
    .label-image img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .label-barcode svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    @page {
      size: 210mm 297mm;
      margin: 0;
    }
    @media print {
