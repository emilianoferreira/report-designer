name: report-designer

x-runtime: &runtime
  restart: unless-stopped
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  web:
    <<: *runtime
    image: ${IMAGE_PREFIX:-report-designer}/web:${RELEASE_TAG:?Set an immutable release tag}
    build: { context: .., dockerfile: deployment/web.Dockerfile }
    ports: ["${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"]
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-api-dotnet:8080}
      NGINX_ENVSUBST_FILTER: ^API_UPSTREAM$
    depends_on:
      api-dotnet: { condition: service_healthy }
      api-nestjs: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  api-dotnet:
    <<: *runtime
    image: ${IMAGE_PREFIX:-report-designer}/api-dotnet:${RELEASE_TAG:?Set an immutable release tag}
    build: { context: .., dockerfile: deployment/api-dotnet.Dockerfile }
    read_only: true
    tmpfs: [/tmp]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Http__MaxRequestBodyBytes: "33554432"
      AllowedHosts: "${PUBLIC_HOST:?Set the public hostname};localhost;127.0.0.1"
    secrets:
      - { source: dotnet_connection, target: ConnectionStrings__Postgres }
      - { source: pg_ca, target: pg-ca.pem }
    healthcheck:
      test: [CMD, curl, --fail, --silent, "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 6

  api-nestjs:
    <<: *runtime
    image: ${IMAGE_PREFIX:-report-designer}/api-nestjs:${RELEASE_TAG:?Set an immutable release tag}
    build: { context: .., dockerfile: deployment/api-nestjs.Dockerfile }
    read_only: true
    tmpfs: [/tmp]
    environment:
      NODE_ENV: production
      PORT: "3000"
      JSON_BODY_LIMIT: 32mb
      DB_HOST: ${DB_HOST:?Set the existing PostgreSQL hostname}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set the existing database name}
      DB_USERNAME: ${DB_USERNAME:?Set the application database user}
      PGSSLMODE: verify-full
      NODE_EXTRA_CA_CERTS: /run/secrets/pg-ca.pem
    secrets:
      - { source: nestjs_password, target: DB_PASSWORD }
      - { source: pg_ca, target: pg-ca.pem }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/templates?companyId=00000000-0000-0000-0000-000000000000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 6

# PostgreSQL is deliberately external. No database service, data volume, seed or reset command.
secrets:
  dotnet_connection:
    file: ${SECRETS_DIR:-./secrets}/ConnectionStrings__Postgres
  nestjs_password:
    file: ${SECRETS_DIR:-./secrets}/DB_PASSWORD
  pg_ca:
    file: ${SECRETS_DIR:-./secrets}/pg-ca.pem
