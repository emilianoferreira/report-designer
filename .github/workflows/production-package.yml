name: Validate authentication, tenant isolation and Docker rollback (no deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install the test tools
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix server --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build and run production images on isolated TLS PostgreSQL
        run: npm run test:docker
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-isolated-validation
          path: e2e/test-results/stage8-*/
          retention-days: 7
      # Only temporary test Compose projects. No push or production credentials/deployment.
