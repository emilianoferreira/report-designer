name: Validate controlled release and isolated recovery (no deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install the test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3-tools age
          npm ci --no-audit --no-fund
          npm ci --prefix server --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Validate encrypted backup, isolated restore and HTTPS rollback
        run: npm run test:release
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-recovery-isolated-validation
          path: e2e/test-results/stage10-*/
          retention-days: 7
      # Only temporary test Compose projects. No push or production credentials/deployment.
